[project]
name = "yuri-bot"
version = "1.0.0"
description = "A chaotic Gen-Z AI Discord bot powered by Gemini + Groq"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saineeee" }]
repository = "https://github.com/Saineeee/Yuri-bot"

dependencies = [
    "discord.py>=2.3,<2.5",
    "python-dotenv>=1.0,<2.0",
    "google-genai>=0.3,<1.0",
    "motor>=3.3,<4.0",
    "dnspython>=2.4,<3.0",
    "groq>=0.11,<1.0",
    "together>=1.2,<2.0",
    "duckduckgo-search>=6.0,<9.0",
    "pytz>=2024.1",
    "pillow>=10.0,<12.0",
    "aiohttp>=3.9,<4.0",
]

[project.optional-dependencies]
voice = ["PyNaCl>=1.5,<2.0", "gTTS>=2.5,<3.0"]
sentry = ["sentry-sdk>=2.0,<3.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# Enable: pycodestyle (E/W), pyflakes (F), isort (I), flake8-bugbear (B),
# flake8-comprehensions (C4), flake8-simplify (SIM), pyupgrade (UP)
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP"]
ignore = [
    "E501",   # line too long, black owns formatting
    "B008",   # function call in default argument (used by discord.py decorators)
    "SIM117", # nested with statements, sometimes clearer to nest
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["utils", "cogs"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | __pycache__
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
    "ignore::DeprecationWarning:motor.*",
]

[tool.coverage.run]
source = ["cogs", "utils.py", "main.py"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
