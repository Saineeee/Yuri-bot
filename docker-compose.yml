# Docker Compose for Yuri-bot
# Usage:
#   1. Copy .env.example to .env and fill in your keys
#   2. docker compose up -d
#   3. View logs: docker compose logs -f

services:
  bot:
    build: .
    container_name: yuri-bot
    restart: unless-stopped
    env_file:
      - .env
    # Discord needs no inbound ports, the bot uses outbound websockets
    volumes:
      # Persist nothing on disk, all state is in MongoDB (see below)
      - ./logs:/app/logs
    depends_on:
      - mongo
    networks:
      - yuri-net

  # Optional: local MongoDB for development.
  # In production, use MongoDB Atlas and remove this service + MONGO_URL override.
  mongo:
    image: mongo:7
    container_name: yuri-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: yuri
      MONGO_INITDB_ROOT_PASSWORD: yuri_local_dev_password
      MONGO_INITDB_DATABASE: yuri_bot_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - yuri-net

volumes:
  mongo-data:

networks:
  yuri-net:
    driver: bridge
